<!DOCTYPE html>
<html lang="en" data-theme="royal" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kushal Multi Speciality Hospital · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="bg-animated"></div>
  <div class="bg-shapes"><span></span><span></span><span></span><span></span></div>
  <div class="ecg-line"><svg viewBox="0 0 1400 60" preserveAspectRatio="none"><path d="M0,30 L300,30 L320,30 L330,5 L345,55 L360,30 L600,30 L620,30 L630,10 L645,50 L660,30 L900,30 L920,30 L935,15 L950,45 L965,30 L1400,30"/></svg></div>

  <div class="login-wrap">
    <div class="login-card glass">
      <div class="brand" style="justify-content:center;flex-direction:column;gap:14px">
        <div class="brand-logo lg"><i class="fa-solid fa-heart-pulse"></i></div>
        <div class="brand-text" style="text-align:center">
          <strong style="font-size:1.25rem">KUSHAL</strong>
          <span>Multi Speciality Hospital</span>
        </div>
      </div>
      <h1>Welcome Back</h1>
      <p class="sub">Sign in to the hospital management system</p>

      <div class="role-pills" id="rolePills">
        <button class="role-pill active" data-role="Admin">Admin</button>
        <button class="role-pill" data-role="Doctor">Doctor</button>
        <button class="role-pill" data-role="Receptionist">Receptionist</button>
        <button class="role-pill" data-role="Nurse">Nurse</button>
        <button class="role-pill" data-role="Lab Technician">Lab Tech</button>
        <button class="role-pill" data-role="Pharmacist">Pharmacist</button>
        <button class="role-pill" data-role="Patient">Patient</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label>Email Address</label>
          <input class="input" type="email" id="email" placeholder="you@kmsh.in" value="admin@kmsh.in" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" placeholder="••••••••" value="admin123" required>
            <button type="button" class="pw-toggle" id="pwToggle"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div class="login-row">
          <label class="checkbox"><input type="checkbox" id="remember" checked> Remember Me</label>
          <a href="#" id="forgotLink" style="color:var(--c-primary);font-weight:600">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-block btn-glow" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>

      <div class="login-divider">OR</div>

      <button class="btn btn-secondary btn-block" id="demoBtn"><i class="fa-solid fa-flask"></i> Demo Login (No credentials)</button>

      <p style="text-align:center;margin-top:18px;font-size:.82rem;color:var(--text-muted)">
        <span id="modeIndicator"><i class="fa-solid fa-circle-notch fa-spin"></i> Checking backend...</span>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let selectedRole = 'Admin';

    (async function() {
      await API.probe();
      DB.seed();
      const ind = $('#modeIndicator');
      if (API.isOnline()) {
        ind.innerHTML = '<i class="fa-solid fa-circle" style="color:#16a34a"></i> Connected to REST API · MySQL mode';
      } else {
        ind.innerHTML = '<i class="fa-solid fa-flask" style="color:#f59e0b"></i> DEMO MODE · Data saved in browser';
        showDemoBanner();
      }

      // Already logged in?
      if (Auth.getSession()) window.location.href = 'dashboard.html';
    })();

    // Role pills
    $('#rolePills').addEventListener('click', e => {
      const p = e.target.closest('.role-pill'); if (!p) return;
      $$('.role-pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      selectedRole = p.dataset.role;
      // Auto-fill demo creds for role
      const map = {
        Admin: ['admin@kmsh.in','admin123'],
        Doctor: ['doctor@kmsh.in','doctor123'],
        Receptionist: ['reception@kmsh.in','reception123'],
        Nurse: ['nurse@kmsh.in','nurse123'],
        'Lab Technician': ['lab@kmsh.in','lab123'],
        Pharmacist: ['pharma@kmsh.in','pharma123'],
        Patient: ['patient@kmsh.in','patient123'],
      };
      const [em, pw] = map[selectedRole] || [];
      $('#email').value = em; $('#password').value = pw;
    });

    // Password toggle
    $('#pwToggle').addEventListener('click', () => {
      const inp = $('#password'); const ic = $('#pwToggle i');
      if (inp.type === 'password') { inp.type = 'text'; ic.className = 'fa-solid fa-eye-slash'; }
      else { inp.type = 'password'; ic.className = 'fa-solid fa-eye'; }
    });

    // Login submit
    $('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('#loginBtn');
      btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Signing in...';
      try {
        await Auth.login($('#email').value, $('#password').value, selectedRole);
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 700);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      }
    });

    // Demo login
    $('#demoBtn').addEventListener('click', () => {
      Auth.demoLogin(selectedRole);
      showToast(`Logged in as ${selectedRole} (Demo)`, 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 600);
    });

    // Forgot password
    $('#forgotLink').addEventListener('click', e => {
      e.preventDefault();
      openModal('<i class="fa-solid fa-key"></i> Reset Password',
        `<div class="field"><label>Email Address</label><input class="input" type="email" placeholder="you@kmsh.in"></div>
         <p class="text-muted" style="font-size:.85rem">A password reset link will be sent to your email (demo only).</p>`,
        { footer: `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="closeModal();showToast('Reset link sent (demo)','info')"><i class="fa-solid fa-paper-plane"></i> Send Link</button>` });
    });
  </script>
</body>
</html>
